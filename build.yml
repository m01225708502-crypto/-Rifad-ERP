name: Build Rifad ERP

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Rifad-ERP.sln

      - name: Build
        run: dotnet build Rifad-ERP.sln --configuration Release --no-restore

      - name: Publish
        run: dotnet publish src/Rifad.ERP/Rifad.ERP.csproj --configuration Release --output artifacts/publish --self-contained false

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rifad-ERP-Windows
          path: artifacts/publish/
